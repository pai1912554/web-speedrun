 rule:{t:'อ่านสูตรให้ออก', d:'<code>width: min(720px, 100% - 40px)</code> แปลว่า "เอาค่าที่น้อยกว่าระหว่าง 720px กับ (ความกว้างพ่อ ลบ 40px)". จอใหญ่ ➝ ได้ 720px. จอเล็ก ➝ ได้ความกว้างจอลบขอบ 40px. <br><code>margin-inline: auto</code> คือ "เว้นซ้ายขวาเท่ากัน" = จัดกลาง'},
 css:`.wrap{
  width: min(720px, 100% - 40px);
  margin-inline: auto;
  padding: 56px 0;
}`,
 cssLines:[
  {c:'.wrap', d:'จุดนำหน้าแปลว่าเลือกจาก <b>class</b>. ใน HTML เขียน <code>class="wrap"</code> แล้ว CSS เขียน <code>.wrap</code> — <b>จุดคือสิ่งที่มือใหม่ลืมบ่อยที่สุด</b>'},
  {c:'width: min(...)', d:'ความกว้างที่ยืดหยุ่นตามจอโดยไม่ต้องเขียน media query'},
  {c:'margin-inline: auto', d:'จัดกลางแนวนอน. <code>inline</code> หมายถึงแกนซ้าย-ขวา'},
  {c:'padding: 56px 0', d:'สองค่า = <b>บน-ล่าง 56px, ซ้าย-ขวา 0</b>. ถ้าใส่ค่าเดียวคือทุกด้านเท่ากัน, สี่ค่าคือ บน ขวา ล่าง ซ้าย (ไล่ตามเข็มนาฬิกา)'}
 ],
 html:`<div class="wrap">
  <h1>ร้านกาแฟบ้านสวน</h1>
  <p class="sub">เปิดทุกวัน 07:00 - 18:00 ริมคลองบางหลวง</p>
</div>`,
 do:[
  'ครอบ <code>&lt;h1&gt;</code> และ <code>&lt;p&gt;</code> เดิมด้วย <code>&lt;div class="wrap"&gt;</code>',
  'บันทึกแล้วลากขอบหน้าต่างเบราว์เซอร์ให้แคบลง สังเกตว่าเนื้อหาไม่ติดขอบจอ'
 ],
 try:'กดปุ่ม <b>เส้นบอกระยะ</b> บนกระดาน แล้วดูกรอบของ <code>.wrap</code> — จะเห็นขอบเขตของกล่องครอบชัดเจน.'
},
/* ---------------- 7 ---------------- */
{
 t:'จัดลำดับตัวอักษร และเว้นระยะด้วย gap',
 why:'ตอนนี้หัวข้อกับย่อหน้าติดกันเพราะเราล้าง margin ทิ้งไปในขั้น reset. วิธีเว้นระยะที่ควบคุมง่ายที่สุดคือ<b>ทำให้กล่องพ่อเป็น flex แล้วสั่ง gap ครั้งเดียว</b> แทนการใส่ margin ทีละตัว.',
 rule:{t:'ทำไม gap ดีกว่า margin', d:'margin ของสองกล่องที่อยู่ติดกันจะ<b>ยุบรวมกันเอง</b>โดยไม่บอกใคร (เรียก margin collapse) ทำให้ระยะที่ได้ไม่ตรงกับที่สั่ง. <code>gap</code> ไม่มีปัญหานี้และแก้ค่าเดียวเปลี่ยนทั้งกลุ่ม.'},
 css:`.wrap{
  display: flex;
  flex-direction: column;
  gap: 16px;
  align-items: flex-start;
}

h1{
  font-size: 36px;
  line-height: 1.15;
  letter-spacing: -1px;
}

.sub{
  font-size: 17px;
  color: #6f6862;
  max-width: 52ch;
}`,
 cssLines:[
  {c:'display: flex;', d:'เปลี่ยนกล่องนี้เป็นแบบ flex — <b>ลูกๆ ข้างในจะเรียงเป็นแถวและสั่ง gap ได้</b>'},
  {c:'flex-direction: column;', d:'ปกติ flex เรียงเป็นแถวนอน. ค่านี้สั่งให้เรียงลงแนวตั้งแทน'},
  {c:'gap: 16px;', d:'ระยะห่างระหว่างลูกทุกตัว. <b>เลือกจากสเกล 4/8/16/24/40/64 เท่านั้น</b> อย่าเดาเป็น 15 หรือ 18'},
  {c:'align-items: flex-start;', d:'ไม่ให้ลูกยืดเต็มความกว้าง แต่ให้กว้างเท่าเนื้อหาจริง — สำคัญตอนมีปุ่มในขั้นถัดไป'},
  {c:'line-height: 1.15;', d:'ระยะระหว่างบรรทัด. <b>ตัวใหญ่ใช้ค่าต่ำ (1.1-1.2) ตัวเนื้อหาใช้ค่าสูง (1.6-1.7)</b> ถ้าใช้ค่าเดียวกันหมดจะดูไม่เป็นมืออาชีพ'},
  {c:'letter-spacing: -1px;', d:'บีบตัวอักษรเข้าหากัน. ตัวใหญ่ที่ไม่บีบจะดูหลวม — <b>รายละเอียดเล็กๆ ที่แยกงานโปรออกจากงานทั่วไป</b>'},
  {c:'max-width: 52ch;', d:'<code>ch</code> คือความกว้างของตัวอักษรประมาณหนึ่งตัว. จำกัดไว้ราว 50-65 ตัวอักษรต่อบรรทัด <b>เกินกว่านั้นตาจะหาบรรทัดถัดไปไม่เจอ</b>'}
 ],
 try:'เปลี่ยน <code>gap</code> เป็น <code>4px</code> แล้วเป็น <code>64px</code> สลับกันดู. ความรู้สึกอึดอัดกับหลวมที่เกิดขึ้นคือสิ่งที่ตาต้องฝึกจับให้ได้.'
},
/* ---------------- 8 ---------------- */
{
 t:'กล่องเนื้อหา — เห็นระยะข้างในกับข้างนอกต่างกันชัดๆ',
 why:'สับสนระหว่าง padding กับ margin คือปัญหาคลาสสิก. ขั้นนี้ทำกล่องจริงขึ้นมาแล้วจะเห็นด้วยตา: <b>padding คือที่ว่างข้างในกล่อง margin คือที่ว่างข้างนอกกล่อง</b>.',
 rule:{t:'จำแบบนี้', d:'กล่องพัสดุ: <b>padding</b> คือโฟมกันกระแทกข้างใน (อยู่ในกล่อง สีพื้นหลังทับถึง) · <b>border</b> คือกระดาษลัง · <b>margin</b> คือช่องว่างระหว่างกล่องกับกล่องข้างๆ (นอกกล่อง สีพื้นหลังไม่ทับ)'},
 css:`.box{
  background: #ffffff;
  border: 1px solid #e6e0d8;
  border-radius: 12px;
  padding: 24px;
  width: 100%;
}

.box h2{ font-size: 19px; margin-bottom: 8px; }
.box p{ color: #6f6862; line-height: 1.7; }`,
 cssLines:[
  {c:'background: #ffffff;', d:'ขาวบนพื้นครีม ทำให้กล่องลอยขึ้นมาจากพื้นหลังโดยไม่ต้องใช้เงา'},
  {c:'border: 1px solid #e6e0d8;', d:'สามค่าเรียงกัน: <b>ความหนา ชนิดเส้น สี</b>. เส้นขอบบางๆ ทำให้ขอบกล่องคมขึ้นมาก — <b>ใส่แล้วงานดูตั้งใจทำขึ้นทันที</b>'},
  {c:'border-radius: 12px;', d:'ความมนของมุม. 8-12px คือช่วงที่ดูทันสมัยและไม่เยอะเกิน'},
  {c:'padding: 24px;', d:'ที่ว่างข้างในระหว่างขอบกล่องกับเนื้อหา. <b>กล่องที่ padding น้อยเกินจะดูอึดอัดที่สุดในบรรดาข้อผิดพลาดทั้งหมด</b>'},
  {c:'width: 100%;', d:'ให้กล่องกว้างเต็มพ่อ. ต้องสั่งเพราะขั้นที่แล้วเราตั้ง <code>align-items: flex-start</code> ซึ่งทำให้ลูกกว้างเท่าเนื้อหา'}
 ],
 html:`<div class="box">
  <h2>เมนูแนะนำประจำสัปดาห์</h2>
  <p>ดริปเมล็ดดอยช้างคั่วอ่อน รสเปรี้ยวส้มและกลิ่นดอกไม้
     เสิร์ฟพร้อมน้ำโซดามะนาว สั่งได้ถึงบ่ายสามโมง</p>
</div>`,
 try:'เปลี่ยน <code>padding: 24px</code> เป็น <code>4px</code> แล้วบันทึก. จากนั้นลองใส่ <code>margin: 24px</code> เพิ่มเข้าไป — สังเกตว่าพื้นขาวขยายตาม padding แต่ไม่ขยายตาม margin. <b>นั่นคือความต่างของสองอย่างนี้</b>.'
},
/* ---------------- 9 ---------------- */
{
 t:'ปุ่มจริง และสถานะตอนเมาส์ชี้',
 why:'ใช้แท็ก <code>&lt;button&gt;</code> เสมอ อย่าใช้ <code>&lt;div&gt;</code> แต่งให้เหมือนปุ่ม. เพราะ button <b>กด Tab ถึงได้ กด Enter แล้วทำงาน และโปรแกรมอ่านหน้าจอรู้ว่ามันคือปุ่ม</b> โดยไม่ต้องเขียนอะไรเพิ่มเลย.',
 rule:{t:'ปุ่มต้องมีสามสถานะ', d:'<b>ปกติ</b> — เห็นชัดว่ากดได้<br><b>hover</b> — ตอบสนองตอนเมาส์ชี้ บอกว่า "ใช่ กดฉันได้"<br><b>focus-visible</b> — กรอบตอนกด Tab มาถึง สำหรับคนที่ใช้คีย์บอร์ดอย่างเดียว. <b>ขาดข้อสุดท้ายคือเสียคะแนน accessibility ฟรีๆ</b>'},
 css:`button{
  background: #7a4b2b;
  color: #ffffff;
  border: 0;
  padding: 13px 26px;
  border-radius: 9px;
  font-weight: 700;
  cursor: pointer;
  transition: .18s;
}

button:hover{
  background: #8f5a35;
  transform: translateY(-2px);
}

button:focus-visible{
  outline: 3px solid #7a4b2b;
  outline-offset: 3px;
}`,
 cssLines:[
  {c:'border: 0;', d:'ลบเส้นขอบเทาที่เบราว์เซอร์ใส่มาให้ปุ่มเป็นค่าเริ่มต้น'},
  {c:'padding: 13px 26px;', d:'สองค่า = บน-ล่าง 13, ซ้าย-ขวา 26. <b>ปุ่มที่กว้างกว่าสูงจะดูสมส่วนกว่าปุ่มสี่เหลี่ยมจัตุรัส</b>'},
  {c:'cursor: pointer;', d:'เปลี่ยนเมาส์เป็นรูปมือ. <b>สัญญาณเล็กๆ ที่บอกว่ากดได้</b> — ลืมข้อนี้ผู้ใช้จะไม่แน่ใจ'},
  {c:'transition: .18s;', d:'ทำให้การเปลี่ยนสีและการขยับนุ่มขึ้นแทนที่จะกระตุก. <b>0.18 วินาทีคือช่วงที่รู้สึกทันทีแต่ไม่แข็ง</b>'},
  {c:'button:hover{', d:'เครื่องหมายโคลอนตามด้วยชื่อสถานะ = "ตอนที่เป็นแบบนี้ให้ใช้กฎนี้"'},
  {c:'transform: translateY(-2px);', d:'ขยับขึ้น 2 พิกเซล. <b>ค่าน้อยๆ พอ</b> — ขยับ 10px จะดูตลกทันที'},
  {c:'button:focus-visible{', d:'สถานะตอนโฟกัสมาถึงด้วยคีย์บอร์ด. ต่างจาก <code>:focus</code> ตรงที่<b>ไม่แสดงตอนคลิกเมาส์</b> จึงไม่รบกวนสายตา'}
 ],
 html:`<button id="orderBtn">สั่งล่วงหน้า</button>
<p id="msg" class="sub"></p>`,
 try:'คลิกที่กระดานขวาแล้วกด <kbd>Tab</kbd> จนโฟกัสมาถึงปุ่ม — ต้องเห็นกรอบชัดเจน. ลองลบบล็อก <code>focus-visible</code> ออกแล้วกด Tab ใหม่ จะเห็นว่าหาไม่เจอว่าตอนนี้อยู่ตรงไหน.'
},
/* ---------------- 10 ---------------- */
{
 t:'JavaScript บรรทัดแรก — ทำให้ปุ่มทำงานจริง',
 why:'HTML คือโครง CSS คือหน้าตา <b>JavaScript คือพฤติกรรม</b>. โค้ดข้างล่างมีแค่สามส่วน: หาของ ➝ รอเหตุการณ์ ➝ ทำอะไรสักอย่าง. ทุกอย่างที่คุณจะเขียนต่อจากนี้คือรูปแบบเดียวกันนี้ซ้ำไปเรื่อยๆ.',
 rule:{t:'script ต้องอยู่ล่างสุด', d:'วาง <code>&lt;script&gt;</code> ไว้<b>ก่อนปิด <code>&lt;/body&gt;</code></b> เสมอ. ถ้าวางไว้บน โค้ดจะทำงานตอนที่ปุ่มยังไม่ถูกสร้าง แล้วจะได้ error ว่า <code>Cannot read properties of null</code> — <b>นี่คือ error ที่มือใหม่เจอบ่อยที่สุด</b>'},
 html:`<script>
  var btn = document.querySelector('#orderBtn');
  var msg = document.querySelector('#msg');
  var count = 0;

  btn.addEventListener('click', function(){
    count = count + 1;
    msg.textContent = 'จองไว้แล้ว ' + count + ' แก้ว';
  });
<\/script>`,
 lines:[
  {c:"document.querySelector('#orderBtn')", d:'<b>หาของในหน้า</b>. เครื่องหมาย <code>#</code> หมายถึงหา id ที่ชื่อนี้ (จุด <code>.</code> คือหา class). เขียนแบบเดียวกับ CSS เป๊ะ'},
  {c:'var count = 0;', d:'<b>สร้างตัวแปรไว้เก็บค่า</b>. ตอนนี้เก็บจำนวนแก้วที่จอง เริ่มจากศูนย์'},
  {c:"btn.addEventListener('click', ...)", d:'<b>รอเหตุการณ์</b> — บอกว่า "เมื่อปุ่มนี้ถูกคลิก ให้รันโค้ดข้างใน". เปลี่ยน <code>click</code> เป็น <code>input</code> หรือ <code>submit</code> ได้ตามที่ต้องการ'},
  {c:'count = count + 1;', d:'บวกหนึ่งทุกครั้งที่คลิก. เขียนสั้นได้ว่า <code>count++</code>'},
  {c:'msg.textContent = ...', d:'<b>เปลี่ยนข้อความบนจอ</b>. <code>textContent</code> ใส่ข้อความล้วน ถ้าอยากใส่ HTML ด้วยใช้ <code>innerHTML</code> แทน'},
  {c:"'จองไว้แล้ว ' + count", d:'เครื่องหมายบวกใช้ต่อข้อความเข้าด้วยกัน. <b>ระวัง</b> — <code>"5" + 1</code> ได้ <code>"51"</code> ไม่ใช่ 6 เพราะตัวแรกเป็นข้อความ ต้องแปลงด้วย <code>Number()</code> ก่อน'}
 ],
 do:[
  'พิมพ์ <code>&lt;script&gt;</code> ก่อนปิด <code>&lt;/body&gt;</code> ในไฟล์คุณ',
  'วางโค้ดข้างบนไว้ข้างใน',
  'บันทึก แล้วกดปุ่มในเบราว์เซอร์ดู',
  'กด <kbd>F12</kbd> เปิด DevTools แล้วดูแท็บ <b>Console</b> — ถ้ามีตัวแดงคือมีบางอย่างผิด'
 ],
 try:'ย้ายบล็อก <code>&lt;script&gt;</code> ทั้งก้อนขึ้นไปไว้ใน <code>&lt;head&gt;</code> แล้วบันทึก. ปุ่มจะหยุดทำงาน และใน Console จะขึ้นว่า <code>Cannot read properties of null</code> — <b>ตอนนี้คุณรู้แล้วว่า error นี้แปลว่าอะไรและแก้ยังไง</b>.'
},
/* ---------------- 11 ---------------- */
{
 t:'ตรวจงานก่อนจบ และรู้ว่าไปต่อที่ไหน',
 why:'ขั้นสุดท้ายไม่เพิ่มโค้ด แต่<b>สร้างนิสัยการตรวจงาน</b>ที่จะใช้ทุกครั้งตลอดการแข่ง.',
 rule:{t:'ตรวจห้าข้อทุกครั้งก่อนส่ง', d:'1) กด <kbd>F12</kbd> ดู Console ไม่มีตัวแดง<br>2) กดทุกปุ่ม ไม่มีปุ่มไหนกดแล้วเงียบ<br>3) กด <kbd>Ctrl</kbd>+<kbd>Shift</kbd>+<kbd>M</kbd> ดูมือถือ ไม่มีของล้นออกนอกจอ<br>4) กด <kbd>Tab</kbd> รัวๆ เห็นกรอบโฟกัสวิ่งครบทุกปุ่ม<br>5) <code>&lt;title&gt;</code> เป็นชื่องานจริง ไม่มีคำว่า test หรือ Lorem หลงเหลือ'},
 css:`/* จัดโค้ดให้สวยอัตโนมัติ: กด Shift + Alt + F ใน VS Code
   ทำทุกครั้งก่อนส่งงาน กรรมการที่เปิดโค้ดดูจะเห็นความต่างทันที */

@media (max-width: 620px){
  h1{ font-size: 28px; }
  .wrap{ padding: 36px 0; }
  button{ width: 100%; }
}

@media (prefers-reduced-motion: reduce){
  *{ transition: none !important; }
}`,
 cssLines:[
