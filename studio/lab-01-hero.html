<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>LAB 01 · หัวเว็บ (Hero) — Studio</title>
<link rel="stylesheet" href="studio.css">
</head>
<body>

<div class="bar"><div class="bar-in">
  <div class="mark">WEB <b>STUDIO</b></div>
  <nav>
    <a href="index.html">ห้องปฏิบัติการ</a>
    <a href="design-eye.html">ฝึกตาออกแบบ</a>
    <a href="../index.html">คลังความรู้</a>
  </nav>
</div></div>

<div class="bench">
  <!-- ========== ซ้าย: ใบสั่งงาน ========== -->
  <div class="sheet">
    <div id="labHead"></div>
    <div id="steps"></div>
  </div>

  <!-- ========== ขวา: กระดานงาน ========== -->
  <div class="board">
    <div class="board-head">
      <div class="seg">
        <button data-mode="build" class="on">ที่กำลังทำ</button>
        <button data-mode="target">เป้าหมาย</button>
      </div>
      <button class="tool" id="noteBtn">เส้นบอกระยะ</button>
      <div class="spacer"></div>
      <div class="sizebtns">
        <button class="tool on" data-w="100%">จอใหญ่</button>
        <button class="tool" data-w="390px">มือถือ</button>
      </div>
    </div>
    <div class="stage"><iframe id="frame" title="ตัวอย่างงาน"></iframe></div>
    <div class="board-foot">
      <span id="stepNow"></span>
      <div class="pbar"><i id="pbar"></i></div>
      <div class="navbtns">
        <button class="ghost" id="prev">ย้อน</button>
        <button id="next">ขั้นต่อไป</button>
      </div>
    </div>
  </div>
</div>

<script>
const LAB = {
no: 1,
title: 'หัวเว็บที่คนอ่าน 3 วินาทีแรกแล้วรู้ว่ากดตรงไหน',
lede: 'Hero คือส่วนที่ตัดสินว่ากรรมการจะประทับใจหรือเลื่อนผ่าน. ทำส่วนนี้ให้ดีอย่างเดียว เว็บก็ดูมีระดับแล้ว. เราจะสร้างทีละชั้น แล้วสังเกตว่าแต่ละชั้นเปลี่ยนความรู้สึกอย่างไร.',
minutes: 25,
uses: ['ลำดับสายตา', 'สเกลระยะห่าง', 'สเกลตัวอักษร', 'จุดเน้นเดียว'],

notes: [
  {sel:'.hero',   label:'padding บน-ล่าง 96px = ที่หายใจ', side:'top'},
  {sel:'.wrap',   label:'กว้างสูงสุด 1080px จัดกลาง', side:'in'},
  {sel:'h1',      label:'48px / 800 / line-height 1.1', side:'right'},
  {sel:'.lede',   label:'18px สีจาง กว้างไม่เกิน 58 ตัวอักษร', side:'bottom'},
  {sel:'.cta',    label:'สีเน้นใช้ที่เดียวในหน้า', side:'top'},
  {sel:'.stats',  label:'gap 40px', side:'bottom'},
],

steps: [
/* ---------------- 1 ---------------- */
{
 t:'วางกล่อง แล้วกำหนดชุดสีก่อนเขียนอย่างอื่น',
 why:'มือใหม่เริ่มจากพิมพ์ข้อความ แล้วค่อยหาสีทีหลัง จบที่สีมั่ว 12 สี. มืออาชีพ<b>ล็อกชุดสีกับชุดระยะห่างก่อน</b> แล้วทุกอย่างหลังจากนั้นเลือกจากในชุดเท่านั้น.',
 rule:{t:'หลักออกแบบ', d:'พื้น 1 สี · ตัวอักษร 2 ระดับ (เข้ม/จาง) · สีเน้น 1 สี. เท่านี้พอสำหรับ 90% ของงาน. ระยะห่างใช้แค่ 4 · 8 · 16 · 24 · 40 · 64 ห้ามใช้ค่าอื่น.'},
 css:`:root{
  --ground:#faf9f7;      /* พื้น */
  --ink:#15181d;         /* ตัวอักษรหลัก */
  --ink-2:#5f6b78;       /* ตัวอักษรรอง */
  --line:#e3e0da;        /* เส้นคั่น */
  --accent:#0f5c4a;      /* สีเน้น ใช้ที่เดียว */
}
body{ background:var(--ground); color:var(--ink); }

/* กล่องครอบ: จัดกลาง + จำกัดความกว้าง + กันชนขอบมือถือ */
.wrap{ width:min(1080px, 100% - 40px); margin-inline:auto; }

.hero{ padding:96px 0; }`,
 html:`<section class="hero">
  <div class="wrap"></div>
</section>`,
 try:'เปลี่ยน <code>--accent</code> เป็น <code>#b03a2e</code> แล้วดูว่าอารมณ์เว็บเปลี่ยนทั้งหน้าจากการแก้จุดเดียว.'
},
/* ---------------- 2 ---------------- */
{
 t:'ใส่ข้อความจริงก่อน ยังไม่ต้องแต่ง',
 why:'ห้ามใช้ Lorem ipsum. ข้อความจริงจะบอกเองว่าบรรทัดยาวแค่ไหน หัวข้อต้องใหญ่เท่าไหร่. ตอนนี้มันจะยังดูแย่ — <b>นั่นถูกต้องแล้ว</b> เพราะเรากำลังดูโครงเนื้อหาล้วนๆ.',
 rule:{t:'ลำดับสายตา', d:'เรียง 3 ชั้นเสมอ: ป้ายเล็กบอกบริบท ➝ พาดหัวบอกว่าเว็บนี้คืออะไร ➝ ประโยคเดียวขยายความ. พาดหัวห้ามเป็นชื่อทีมหรือชื่อระบบ ต้องเป็นประโยชน์ที่ผู้ใช้ได้รับ.'},
 into:'.hero .wrap',
 html:`<p class="eyebrow">โครงการอาสาสมัครในชุมชน</p>

<h1>หาที่ลงแรงใกล้บ้าน ได้ภายในสามคลิก</h1>

<p class="lede">รวมงานอาสาจาก 240 องค์กรทั่วประเทศไว้ที่เดียว
   กรองตามวันว่างและระยะทาง แล้วสมัครได้ทันทีโดยไม่ต้องโทรถาม</p>`,
 try:'ลองเปลี่ยนพาดหัวเป็น "ระบบจัดการอาสาสมัคร" แล้วอ่านใหม่ — รู้สึกต่างไหม? ประโยคแรกควรพูดถึง<b>ผู้ใช้</b> ไม่ใช่ตัวระบบ.'
},
/* ---------------- 3 ---------------- */
{
 t:'สร้างลำดับด้วยขนาดและน้ำหนัก ไม่ใช่ด้วยสี',
 why:'มือใหม่แยกความสำคัญด้วยการเปลี่ยนสีตัวอักษร ผลคือหน้าเว็บลายพร้อย. เครื่องมือที่แรงที่สุดคือ<b>ขนาด</b> กับ<b>น้ำหนักตัวอักษร</b> สีเป็นตัวช่วยอันดับสาม.',
 rule:{t:'สเกลตัวอักษร', d:'ใช้ 4 ระดับพอ — 48 / 20 / 16 / 13. ระยะห่างระหว่างระดับต้องชัด ถ้า 20 กับ 18 ตาจะแยกไม่ออก กลายเป็นดูรกเปล่าๆ. หัวข้อใหญ่ตั้ง line-height 1.1 เพราะบรรทัดยาวๆ ที่ห่างเกินจะดูหลุดกัน.'},
 css:`.eyebrow{
  font-size:13px;
  letter-spacing:1.6px;        /* ตัวเล็กต้องถ่างถึงอ่านง่าย */
  text-transform:uppercase;
  color:var(--accent);
  font-weight:600;
}

h1{
  font-size:clamp(32px, 5.4vw, 48px);   /* เล็กสุด, ยืด, ใหญ่สุด */
  line-height:1.1;
  letter-spacing:-1.4px;                 /* ตัวใหญ่ต้องบีบเข้า */
  font-weight:800;
  text-wrap:balance;                     /* กันบรรทัดสุดท้ายเหลือคำเดียว */
}

.lede{
  font-size:18px;
  color:var(--ink-2);
  max-width:56ch;              /* บรรทัดยาวเกิน 65 ตัวอักษรจะอ่านล้า */
  line-height:1.65;
}`,
 try:'ลบ <code>letter-spacing:-1.4px</code> ออก แล้วสลับดู. ตัวอักษรใหญ่ที่ไม่บีบจะดูหลวมเหมือนงานมือสมัครเล่น — รายละเอียดเล็กๆ แบบนี้แหละที่แยกงานโปรออกจากงานทั่วไป.'
},
/* ---------------- 4 ---------------- */
{
 t:'ให้ระยะห่างทำงาน แทนการใส่เส้นคั่น',
 why:'อยากแยกของสองก้อนออกจากกัน มือใหม่ลากเส้นคั่น. จริงๆ แล้ว<b>ช่องว่างทำงานได้ดีกว่าเส้น</b> และดูสะอาดกว่ามาก. หลักคือของที่เกี่ยวข้องกันอยู่ใกล้ ของคนละเรื่องอยู่ห่าง.',
 rule:{t:'ความใกล้ชิด', d:'ป้ายกับพาดหัวเป็นเรื่องเดียวกัน ➝ ห่าง 16px. คำโปรยเป็นอีกชั้น ➝ ห่าง 24px. ทุกค่าหยิบจากสเกล 4/8/16/24/40/64 ห้ามเดาเป็น 18px หรือ 22px.'},
 css:`.hero .wrap{
  display:flex;
  flex-direction:column;
  gap:24px;              /* ระยะห่างมาตรฐานระหว่างก้อน */
  align-items:flex-start;
}

.eyebrow{ margin-bottom:-8px; }   /* ดึงป้ายให้ชิดพาดหัว = เป็นก้อนเดียวกัน */`,
 try:'เปลี่ยน <code>gap</code> เป็น 8px แล้ว 64px สลับกันดู. 8 = อึดอัด 64 = หลุดจากกัน. ค่ากลางๆ ที่พอดีคือสิ่งที่ตาต้องฝึกจับ.'
},
/* ---------------- 5 ---------------- */
{
 t:'ปุ่มหลักหนึ่งปุ่ม กับปุ่มรองที่ต้องไม่แย่งซีน',
 why:'ถ้ามีปุ่มเด่นสองปุ่ม เท่ากับไม่มีปุ่มเด่นเลย ผู้ใช้จะลังเล. ปุ่มหลักได้สีเน้นเต็ม ปุ่มรองเป็นแค่เส้นขอบ — คนยังเห็น แต่รู้ทันทีว่าอันไหนคือทางหลัก.',
 rule:{t:'จุดเน้นเดียว', d:'สีเน้นในหน้านี้ปรากฏแค่ 2 ที่: ป้ายเล็กบนสุด กับปุ่มหลัก. ถ้าเอาสีเน้นไปแปะทุกที่ มันจะเลิกเน้นทันที.'},
 css:`.actions{ display:flex; gap:12px; flex-wrap:wrap; margin-top:8px; }

.cta{
  background:var(--accent);
  color:#fff;
  border:0;
  padding:14px 28px;
  border-radius:8px;
  font-weight:700;
  cursor:pointer;
  transition:.18s;                        /* ทำให้ทุกอย่างนุ่มขึ้น */
}
.cta:hover{ transform:translateY(-2px); box-shadow:0 8px 20px rgba(15,92,74,.28); }
.cta:focus-visible{ outline:3px solid var(--accent); outline-offset:3px; }

.cta.quiet{
  background:transparent;
  color:var(--ink);
  border:1px solid var(--line);
  box-shadow:none;
}
.cta.quiet:hover{ border-color:var(--ink-2); transform:none; box-shadow:none; }`,
 into:'.hero .wrap',
 html:`<div class="actions">
  <button class="cta">ดูงานอาสาใกล้ฉัน</button>
  <button class="cta quiet">องค์กรลงประกาศ</button>
</div>`,
 try:'ลองทำให้ปุ่มรองเป็นสีเน้นเหมือนกัน แล้วมองเร็วๆ — ตาจะเริ่มลังเล นี่คืออาการของงานที่ไม่มีลำดับ.'
},
/* ---------------- 6 ---------------- */
{
 t:'ตัวเลขที่ทำให้เว็บดูน่าเชื่อถือ',
 why:'แถวตัวเลขสั้นๆ ใต้ปุ่มเพิ่มความน่าเชื่อถือได้มากโดยใช้เวลาทำ 3 นาที. เทคนิคคือ<b>ตัวเลขใหญ่ คำอธิบายเล็กและจาง</b> — สลับกันเมื่อไหร่จะกลายเป็นข้อความธรรมดาที่ไม่มีใครมอง.',
 rule:{t:'ความแตกต่างของขนาด', d:'ตัวเลข 30px หนา กับคำอธิบาย 13px จาง = ต่างกันพอให้ตาแยกออกในพริบตา. ตัวเลขที่ต้องเรียงตรงกันให้ใส่ font-variant-numeric:tabular-nums.'},
 css:`.stats{
  display:flex;
  gap:40px;
  flex-wrap:wrap;
  margin-top:16px;
  padding-top:32px;
  border-top:1px solid var(--line);
  width:100%;
}
.stats b{
  display:block;
  font-size:30px;
  font-weight:800;
  letter-spacing:-1px;
  font-variant-numeric:tabular-nums;
}
.stats span{ font-size:13px; color:var(--ink-2); }`,
 into:'.hero .wrap',
 html:`<div class="stats">
  <div><b>240</b><span>องค์กรที่ร่วมโครงการ</span></div>
  <div><b>1,860</b><span>งานที่เปิดรับตอนนี้</span></div>
  <div><b>3 วัน</b><span>เวลาเฉลี่ยที่ได้ตอบกลับ</span></div>
</div>`,
 try:'สลับขนาดกัน — ทำตัวเลขเป็น 13px และคำอธิบายเป็น 30px. อ่านแล้วสมองจะสะดุด เพราะลำดับความสำคัญขัดกับสิ่งที่ตาคาดหวัง.'
},
/* ---------------- 7 ---------------- */
{
 t:'ตรวจงานเหมือนมืออาชีพ 4 ข้อสุดท้าย',
 why:'ขั้นนี้ไม่เพิ่มของใหม่ แต่<b>เก็บรายละเอียดที่คนแยกไม่ออกว่าทำไมงานคนอื่นดูดีกว่า</b>. กดปุ่ม "มือถือ" ด้านบนเพื่อตรวจไปพร้อมกัน.',
 rule:{t:'เช็ก 4 ข้อ', d:'1) พาดหัวย่อขยายเองด้วย clamp แล้วหรือยัง<br>2) บรรทัดข้อความยาวไม่เกิน ~60 ตัวอักษร<br>3) ปุ่มมีสถานะ hover และ focus ที่มองเห็น (คนกด Tab ต้องรู้ว่าอยู่ตรงไหน)<br>4) มือถือแล้วไม่มีอะไรล้นออกนอกจอ'},
 css:`/* พื้นหลังไล่สีจางๆ ให้ hero มีความลึกโดยไม่แย่งความสนใจ */
.hero{
  background:
    radial-gradient(700px 300px at 12% 0%, rgba(15,92,74,.09), transparent 65%);
}

/* มือถือ: ลดที่หายใจลง ไม่งั้นต้องเลื่อนนานกว่าจะเห็นเนื้อหา */
@media (max-width:720px){
  .hero{ padding:56px 0; }
  .stats{ gap:24px; }
  .cta{ width:100%; }        /* ปุ่มเต็มความกว้าง กดง่ายด้วยนิ้วโป้ง */
  .actions{ width:100%; }
}

/* เคารพผู้ใช้ที่ตั้งค่าว่าไม่อยากเห็นภาพเคลื่อนไหว */
@media (prefers-reduced-motion:reduce){
  *{ transition:none !important; }
}`,
 try:'กดปุ่ม <b>เส้นบอกระยะ</b> บนกระดาน แล้วเทียบตัวเลขทุกช่องกับสเกล 4/8/16/24/40/64 — ทุกค่าควรอยู่ในสเกล นี่คือวิธีตรวจงานตัวเองที่เร็วที่สุด.'
},
]
};
</script>
<script src="lab.js"></script>
</body>
</html>
