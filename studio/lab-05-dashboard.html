<script>
const LAB = {
no: 5,
title: 'แดชบอร์ด — งานออกแบบข้อมูล ไม่ใช่งานออกแบบหน้าเว็บ',
lede: 'หน้าเว็บทั่วไปคนอ่านจากบนลงล่าง แดชบอร์ดคนกวาดตาหาสิ่งผิดปกติ. กติกาจึงต่างกันสิ้นเชิง: สรุปมาก่อนรายละเอียด และสถานะต้องอ่านออกโดยไม่ต้องอ่านตัวเลข.',
minutes: 28,
uses: ['ออกแบบข้อมูล', 'สีเชิงความหมาย', 'กราฟด้วย CSS', 'ตารางที่อ่านง่าย'],

notes: [
  {sel:'.kpis',       label:'สรุปอยู่บนสุดเสมอ', side:'top'},
  {sel:'.kpi .v',     label:'28px tabular-nums — ตัวเลขเรียงตรงกัน', side:'in'},
  {sel:'.chart',      label:'กราฟจาก flex + height เป็น % ไม่ใช้ไลบรารี', side:'top'},
  {sel:'.pill.warn',  label:'สีความหมาย แยกจากสีแบรนด์', side:'right'},

steps: [
{
 t:'สรุปก่อน รายละเอียดทีหลัง',
 why:'คนเปิดแดชบอร์ดมีคำถามในหัวว่า "วันนี้มีอะไรต้องห่วงไหม". <b>แถวตัวเลขสรุปบนสุดต้องตอบคำถามนั้นภายใน 2 วินาที</b> ถ้าต้องเลื่อนหาก่อนถึงจะรู้ แปลว่าออกแบบผิดลำดับ.',
 rule:{t:'เลือก 4 ตัวเลขพอ', d:'แดชบอร์ดที่ขึ้นตัวเลข 12 ค่าเท่ากันหมดคือแดชบอร์ดที่ไม่บอกอะไรเลย. เลือกมา 3-4 ตัวที่<b>ถ้าค่าผิดปกติแล้วต้องลงมือทำอะไรสักอย่าง</b> ที่เหลือเก็บไว้หน้ารายละเอียด.'},
 css:`:root{
  --ground:#0f1216;
  --panel:#171b21;
  --panel-2:#1e242c;
  --ink:#e9edf2;
  --ink-2:#8d99a8;
  --line:#262d36;
  --accent:#5b8cff;

}
body{ background:var(--ground); color:var(--ink); padding:22px; }
.wrap{ width:min(940px,100%); margin-inline:auto; }

.top{ display:flex; align-items:baseline; gap:12px; margin-bottom:18px; flex-wrap:wrap; }
.top h1{ font-size:20px; letter-spacing:-.4px; }
.top .when{ color:var(--ink-2); font-size:13px; margin-left:auto; }

.kpis{ display:grid; gap:12px; grid-template-columns:repeat(auto-fit,minmax(170px,1fr)); }

.kpi .d{ font-size:12.5px; }
.up{ color:var(--good); } .down{ color:var(--bad); }`,
 html:`<div class="wrap">
  <div class="top">

      <div class="v">42<span style="font-size:15px;color:#8d99a8"> / 45</span></div>

      <div class="v">6.4</div><div class="d up">▲ 0.3 จากเมื่อวาน</div></div>

{

 rule:{t:'อย่าใช้สีลอยๆ', d:'ป้ายสถานะต้องมี<b>ทั้งสีและข้อความ</b>. วงกลมแดงเฉยๆ คนตาบอดสีอ่านไม่ออก และคนทั่วไปก็ต้องเดา. ป้ายที่เขียนว่า "เกินเกณฑ์" พร้อมพื้นแดงจางๆ อ่านออกทันทีทุกคน.'},
 css:`.pill{

.pill.warn{ color:var(--warn); background:color-mix(in srgb,var(--warn) 12%,transparent); }
.pill.bad { color:var(--bad);  background:color-mix(in srgb,var(--bad) 12%,transparent); }

.panel{
  background:var(--panel); border:1px solid var(--line);
  border-radius:11px; padding:18px; margin-top:14px;
}
.panel h2{ font-size:13.5px; color:var(--ink-2); font-weight:600; margin-bottom:14px; }`,
 into:'.wrap',
 html:`<div class="panel">
  <h2>สถานะสถานีที่ต้องดูวันนี้</h2>
  <div style="display:flex;gap:8px;flex-wrap:wrap">

 try:'ลองเปลี่ยน <code>--accent</code> เป็นสีเขียวเดียวกับ <code>--good</code> แล้วดูทั้งหน้า. จะเริ่มแยกไม่ออกว่าเขียวไหนคือ "ปกติ" เขียวไหนคือ "ปุ่ม" — นี่คือเหตุผลที่ต้องแยกสองชุดสีออกจากกัน.'
},
{
 t:'กราฟแท่งจาก CSS ล้วน ไม่ต้องใช้ไลบรารี',
 why:'โจทย์แข่งมักห้ามใช้ไลบรารีภายนอก หรือเน็ตใช้ไม่ได้. กราฟแท่งทำได้ด้วย flex กับความสูงเป็นเปอร์เซ็นต์ — <b>สิบบรรทัด และควบคุมหน้าตาได้เต็มที่</b>.',
 rule:{t:'สูตรความสูง', d:'ความสูงแท่ง = <code>ค่าของแท่งนี้ ÷ ค่าสูงสุด × 100%</code>. หาค่าสูงสุดด้วย <code>Math.max(...ค่าทั้งหมด)</code> เสมอ อย่าใส่ตัวเลขตายตัว ไม่งั้นข้อมูลเปลี่ยนแล้วกราฟล้น.'},
 css:`.chart{ display:flex; align-items:flex-end; gap:8px; height:150px; }
.col{ flex:1; display:flex; flex-direction:column; justify-content:flex-end;
      align-items:center; gap:6px; height:100%; }
.col .bar{
  width:100%;
  background:var(--accent);
  border-radius:5px 5px 0 0;
  transition:height .5s;
  position:relative;
}
.col .bar.hot{ background:var(--bad); }        /* แท่งที่ผิดปกติ เปลี่ยนสีเลย */
.col .bar:hover::after{
  content:attr(data-v);
  position:absolute; top:-22px; left:50%; transform:translateX(-50%);
  font-size:11px; color:var(--ink-2); white-space:nowrap;
}
.col .lb{ font-size:11px; color:var(--ink-2); }
.axis{ display:flex; justify-content:space-between; font-size:11px;
       color:var(--ink-2); border-top:1px solid var(--line);
       padding-top:6px; margin-top:8px; }`,
 cssLines:[
  {c:'align-items: flex-end;', d:'ดันแท่งทุกอันไป<b>เกาะขอบล่าง</b> แท่งจึงงอกขึ้นจากฐานเดียวกันเหมือนกราฟจริง'},
  {c:'height: 150px;', d:'ความสูงของพื้นที่กราฟ. <b>ต้องกำหนดค่าตายตัว</b>เพราะแท่งใช้เปอร์เซ็นต์ ซึ่งต้องมีของให้เทียบ'},
  {c:'.col{ height:100%; }', d:'แต่ละคอลัมน์สูงเต็มพื้นที่กราฟ <b>เพื่อให้แท่งข้างในคำนวณเปอร์เซ็นต์จากความสูงเดียวกันทุกอัน</b>'},
  {c:'style="height: 57%"', d:'ค่านี้มาจาก <code>ค่าของแท่งนี้ ÷ ค่าสูงสุด × 100</code> คำนวณด้วย JavaScript. <b>อย่าใส่ตัวเลขตายตัว</b> ไม่งั้นข้อมูลเปลี่ยนแล้วกราฟล้น'},
  {c:'.bar.hot{ background: var(--bad); }', d:'แท่งที่ผิดปกติเปลี่ยนสีเลย. <b>ในแดชบอร์ด สีมีหน้าที่บอกสถานะ ไม่ใช่ตกแต่ง</b>'},
  {c:'content: attr(data-v)', d:'ดึงค่าจาก attribute <code>data-v</code> ของแท็กนั้นมาแสดง. <b>ทำ tooltip ได้โดยไม่ต้องเขียน JavaScript เพิ่มเลย</b>'}
 ],
 into:'.wrap',
 html:`<div class="panel">
  <h2>จำนวนแจ้งเตือนย้อนหลัง 7 วัน</h2>
  <div class="chart" id="chart"></div>
  <div class="axis"><span>7 วันก่อน</span><span>วันนี้</span></div>
</div>

<script>
  var data = [
    {d:'จ', v:2}, {d:'อ', v:3}, {d:'พ', v:1},
    {d:'พฤ', v:4}, {d:'ศ', v:3}, {d:'ส', v:2}, {d:'อา', v:7}
  ];
  var max = Math.max.apply(null, data.map(function(x){ return x.v; }));

  document.getElementById('chart').innerHTML = data.map(function(x){
    var pct = (x.v / max * 100).toFixed(0);
    var hot = x.v >= max ? ' hot' : '';
    return '<div class="col">' +
             '<div class="bar' + hot + '" style="height:' + pct + '%" data-v="' + x.v + ' ครั้ง"></div>' +
             '<div class="lb">' + x.d + '</div>' +
           '</div>';
  }).join('');
<\/script>`,
 try:'ชี้เมาส์ที่แท่งกราฟในกระดาน — ตัวเลขจะโผล่. ลองเปลี่ยนค่าวันอาทิตย์เป็น 20 แล้วสังเกตว่าแท่งอื่นเตี้ยลงเองเพราะคำนวณจากค่าสูงสุด.'
},
{
 t:'ตาราง: ตัวเลขชิดขวา ข้อความชิดซ้าย',

 rule:{t:'เส้นแนวนอนพอ ไม่ต้องมีแนวตั้ง', d:'ตารางที่ตีกรอบทุกช่องดูเหมือนสเปรดชีต และอ่านล้า. ใช้เส้นคั่นแถวบางๆ อย่างเดียว แล้วให้ระยะห่างทำหน้าที่แยกคอลัมน์.'},
