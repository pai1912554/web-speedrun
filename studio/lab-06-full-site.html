  {c:'    <div class="menu-grid" id="menuGrid"></div>',

  {c:"  {id:1, name:'แกงส้มชะอมกุ้ง', cat:'แกง', price:180,\n   img:'https://picsum.photos/seed/soup1/500/380', desc:'เปรี้ยวนำ เผ็ดตาม ใช้กุ้งแม่น้ำสด'},",

  {c:"  {id:2, name:'ผัดกะเพราหมูกรอบ', cat:'ผัด', price:120,\n   img:'https://picsum.photos/seed/basil/500/380', desc:'กะเพราใบใหญ่จากสวนหลังร้าน'},\n" +

   d:'อีก 7 จาน <b>รูปแบบเดียวกันเป๊ะ</b> — ตรงนี้แค่คัดลอกบรรทัดบนแล้วเปลี่ยนค่า'},

   d:'ปิด array. <b>ตรงนี้คือที่เดียวที่ต้องแก้เวลาอยากเพิ่มหรือลดเมนู</b> — ไม่ต้องไปยุ่งกับ HTML เลย'},

  {c:"var grid = document.querySelector('#menuGrid');",
   d:'จับกล่องว่างที่เตรียมไว้ <b>เก็บใส่ตัวแปรครั้งเดียว</b> แล้วเรียกใช้ซ้ำได้ตลอด — เร็วกว่าเรียก querySelector ทุกครั้ง'},
  {c:'function renderMenu(list){',
   d:'<b>ฟังก์ชันวาดรายการ — ตัวสำคัญที่สุดของเว็บนี้</b><br>รับรายการเข้ามา แล้ววาดออกไป. <b>ต้องรับเป็นพารามิเตอร์ ไม่ใช่ไปอ่าน <code>dishes</code> ตรงๆ</b> เพราะขั้นถัดไปจะส่งรายการที่กรองแล้วเข้ามาแทน'},
  {c:'  grid.innerHTML = list.map(function(d){',
   d:'<code>map</code> = <b>แปลงของทุกชิ้นเป็นอย่างอื่น</b> ตรงนี้คือแปลง object เป็นข้อความ HTML<br><code>d</code> คือของหนึ่งชิ้นในรอบนั้น จะตั้งชื่อว่าอะไรก็ได้'},
  {c:'    return \'<article class="dish">\' +',
   d:'ขึ้นต้นการ์ดหนึ่งใบ. ใช้ <code>article</code> แทน <code>div</code> เพราะ<b>เป็นเนื้อหาที่ยืนอยู่ได้ด้วยตัวเอง</b> — เป็นคะแนน semantic ฟรี<br>เครื่องหมาย <code>+</code> ท้ายบรรทัดคือ<b>ต่อข้อความกับบรรทัดถัดไป</b>'},
  {c:'      \'<figure><img src="\' + d.img + \'" alt="\' + d.name + \'" loading="lazy"><\\/figure>\' +',
   d:'สังเกตการสลับ <b>ข้อความ + ตัวแปร + ข้อความ</b><br>• <code>alt</code> ใส่ชื่ออาหารจริง <b>ไม่ใช่คำว่า "รูปภาพ"</b><br>• <code>loading="lazy"</code> โหลดรูปเมื่อเลื่อนถึงเท่านั้น <b>หน้าเว็บเปิดเร็วขึ้นมากเมื่อมีรูปเยอะ</b>'},
  {c: "      '<div class=\"in\">' +\n" +
      "        '<span class=\"chip-cat\">' + d.cat + '<\\/span>' +\n" +
      "        '<h3>' + d.name + '<\\/h3>' +\n" +
      "        '<p class=\"desc\">' + d.desc + '<\\/p>' +",
   d:'เนื้อหาการ์ดเรียงตามความสำคัญ: <b>หมวด ➝ ชื่อ ➝ คำอธิบาย</b><br>ใช้ <code>h3</code> เพราะอยู่ใต้ <code>h2</code> ของ section <b>ห้ามข้ามระดับหัวข้อ</b>'},
  {c: "        '<div class=\"foot\"><span class=\"price\">' + d.price + ' บาท<\\/span>' +\n" +
      "        '<button class=\"btn quiet pick\" data-id=\"' + d.id + '\">เลือก<\\/button><\\/div>' +",
   d:'<code>data-id</code> = <b>ฝากเลขประจำตัวไว้กับปุ่ม</b> เพื่อให้ JavaScript รู้ว่าปุ่มนี้เป็นของอาหารจานไหน<br>อ่านค่าคืนด้วย <code>btn.dataset.id</code> — จะใช้จริงในขั้นที่ 7'},
  {c: "      '<\\/div><\\/article>';", d:'ปิดการ์ด และจบข้อความที่ต่อกันมาทั้งหมดด้วยเซมิโคลอน'},
  {c: "  }).join('');",
   d:'<code>map</code> คืน<b>รายการของข้อความ</b> ไม่ใช่ข้อความเดียว<br><code>join(\'\')</code> จึงต้องมาต่อทุกชิ้นเข้าด้วยกัน — <b>ลืม join จะเห็นลูกน้ำคั่นระหว่างการ์ดทุกใบ</b>'},
  {c:'}', d:''},
  {c:'renderMenu(dishes);',
   d:'<b>เรียกครั้งแรกด้วยข้อมูลทั้งหมด</b> ไม่เรียกก็จะไม่มีอะไรขึ้นบนจอ — เป็นสาเหตุยอดฮิตของอาการ "ไม่มี error แต่หน้าว่าง"'},
  {c:'<\/script>', d:''},
 ],
 try:'เพิ่มเมนูใหม่หนึ่งบรรทัดใน array แล้วบันทึก — การ์ดใบใหม่จะโผล่มาเอง. <b>นี่คือเหตุผลที่ต้องเก็บข้อมูลแยกจากหน้าตา</b>.'
},
/* ============ 5 ============ */
{
 t:'ค้นหาและกรองหมวด — ฟีเจอร์ที่โจทย์ขอบ่อยที่สุด',
 why:'ตอนนี้มีข้อมูลอยู่ในรูปที่ถูกต้องแล้ว การเพิ่มค้นหากับกรองจึงใช้โค้ดไม่กี่บรรทัด. <b>หลักคือ ไม่แก้ข้อมูลต้นฉบับ แต่สร้างรายการที่ผ่านเงื่อนไขขึ้นมาใหม่แล้ววาดใหม่</b>.',
 rule:{t:'สูตรกรองที่ใช้ได้กับทุกโจทย์', d:'<code>ข้อมูลทั้งหมด.filter(เงื่อนไข).map(สร้าง HTML)</code><br><br>ถ้ามีหลายเงื่อนไขพร้อมกัน ใช้ <code>&&</code> เชื่อม. <b>เขียนฟังก์ชันเดียวที่รวมทุกเงื่อนไข แล้วให้ทั้งช่องค้นหาและปุ่มหมวดเรียกฟังก์ชันเดียวกันนี้</b> — ไม่งั้นกรองหมวดแล้วคำค้นจะหาย.'},
 css:`/* ===== 5. แถบเครื่องมือค้นหาและกรอง ===== */
.tools{ display:flex; gap:10px; flex-wrap:wrap; align-items:center; margin-bottom:18px; }
.tools input{
  flex:1; min-width:200px; height:44px; padding:0 14px;
  border:1px solid var(--line); border-radius:10px; background:var(--panel);
}
.tools input:focus{
  outline:none; border-color:var(--accent);
  box-shadow:0 0 0 3px color-mix(in srgb, var(--accent) 16%, transparent);
}
.tools select{
  height:44px; padding:0 12px;
  border:1px solid var(--line); border-radius:10px; background:var(--panel);
}

.cats{ display:flex; gap:8px; flex-wrap:wrap; margin-bottom:20px; }
.cat{
  border:1px solid var(--line); background:var(--panel); color:var(--ink-2);
  padding:7px 16px; border-radius:99px; cursor:pointer; font-size:14px; transition:.15s;
}
.cat:hover{ color:var(--ink); }
.cat.on{ background:var(--accent); border-color:var(--accent); color:#fff; font-weight:600; }

.count{ font-size:13.5px; color:var(--ink-2); margin-bottom:14px; }
.empty{
  grid-column:1 / -1; text-align:center; padding:52px 20px;
  border:1px dashed var(--line); border-radius:var(--r); color:var(--ink-2);
}
.empty b{ display:block; color:var(--ink); font-size:16px; margin-bottom:4px; }`,
 into:'#menu .wrap .head',
 html:`<div class="tools" style="margin-top:20px">
  <input id="search" type="search" placeholder="ค้นหาชื่อเมนู เช่น กะเพรา" aria-label="ค้นหาเมนู">
  <select id="sort" aria-label="เรียงลำดับ">
    <option value="default">เรียง: ตามร้านแนะนำ</option>
    <option value="low">ราคา น้อยไปมาก</option>
    <option value="high">ราคา มากไปน้อย</option>
  </select>
</div>
<div class="cats" id="cats"></div>
<p class="count" id="count"></p>`,
 try:'ลองพิมพ์คำที่ไม่มีในเมนู เช่น "พิซซ่า" — ต้องเห็นกล่องสถานะว่าง ไม่ใช่หน้าจอเปล่า.'
},
/* ============ 6 ============ */
{
 t:'ต่อสายให้เครื่องมือทำงานจริง',
 why:'สามส่วนนี้ต้องทำงานร่วมกัน: ช่องค้นหา ปุ่มหมวด และตัวเรียง. <b>ความลับคือให้ทุกอันเรียกฟังก์ชัน <code>apply()</code> เดียวกัน</b> ซึ่งอ่านค่าจากทั้งสามที่แล้วค่อยวาดใหม่. ถ้าแยกกันเขียนจะกัดกันเอง.',
 rule:{t:'จังหวะการฟังเหตุการณ์', d:'<code>input</code> = ทุกตัวอักษรที่พิมพ์ (ใช้กับช่องค้นหา ได้ผลลัพธ์ทันที)<br><code>change</code> = เมื่อเลือกค่าเสร็จ (ใช้กับ select)<br><code>click</code> = คลิก (ใช้กับปุ่มหมวด)'},
 partsLang:'js',
 partsWhere:'พิมพ์ต่อจาก script ก้อนเดิม',
 parts:[
  {c:'<script>', d:''},
  {c:"var cats = ['ทั้งหมด'];",
   d:'เริ่มรายการหมวดด้วยคำว่า "ทั้งหมด" ไว้ก่อนหนึ่งตัว <b>เพราะมันไม่ได้มาจากข้อมูล แต่เป็นตัวเลือกที่เราเพิ่มเอง</b>'},
  {c:'dishes.forEach(function(d){',
   d:'วนดูอาหารทีละจาน. <code>forEach</code> ต่างจาก <code>map</code> ตรงที่<b>ไม่คืนค่าอะไรกลับมา</b> ใช้เมื่อแค่อยากทำอะไรสักอย่างกับของทุกชิ้น'},
  {c:'  if(cats.indexOf(d.cat) === -1) cats.push(d.cat);',
   d:'<code>indexOf</code> คืนตำแหน่งที่เจอ <b>ถ้าไม่เจอจะได้ -1</b>. บรรทัดนี้จึงแปลว่า "ถ้ายังไม่มีหมวดนี้ ให้เพิ่มเข้าไป"<br><b>ผลคือปุ่มหมวดสร้างจากข้อมูลจริง</b> — เพิ่มเมนูหมวดใหม่แล้วปุ่มโผล่เอง ไม่ต้องแก้สองที่'},
  {c:'});', d:''},
  {c:"var activeCat = 'ทั้งหมด';",
   d:'<b>ตัวแปรจำสถานะ</b> ว่าตอนนี้กดหมวดไหนอยู่. ต้องเก็บไว้นอกฟังก์ชันเพราะทั้งช่องค้นหาและปุ่มหมวดต้องอ่านค่านี้'},
  {c:"document.querySelector('#cats').innerHTML = cats.map(function(c){",
   d:'สร้างปุ่มจากรายการหมวด — <b>รูปแบบเดียวกับที่วาดการ์ดอาหารในขั้นที่แล้ว</b> คือ map แล้ว join'},
  {c: "  return '<button class=\"cat' + (c === activeCat ? ' on' : '') +\n" +
      "         '\" data-cat=\"' + c + '\">' + c + '<\\/button>';",
   d:'<code>เงื่อนไข ? ค่าเมื่อจริง : ค่าเมื่อเท็จ</code> เรียกว่า ternary — <b>เขียน if-else ในบรรทัดเดียว</b><br>ตรงนี้แปลว่า "ถ้าเป็นหมวดที่กำลังเลือกอยู่ ให้ใส่ class <code>on</code> ด้วย"'},
  {c: "}).join('');", d:''},
  {c:'function apply(){',
   d:'<b>ฟังก์ชันกลาง — หัวใจของขั้นนี้</b>. ช่องค้นหา ปุ่มหมวด และตัวเรียง จะเรียกฟังก์ชันนี้ทั้งหมด<br><b>ถ้าแยกกันเขียนคนละฟังก์ชัน มันจะกัดกันเอง</b> — กรองหมวดแล้วคำค้นหาย'},
  {c:"  var q = document.querySelector('#search').value.toLowerCase().trim();",
   d:'อ่านคำค้น แล้วแปลงเป็นตัวพิมพ์เล็กและตัดช่องว่างหัวท้าย<br><b><code>.toLowerCase()</code> ต้องทำทั้งสองฝั่ง</b> ไม่งั้นพิมพ์ตัวใหญ่แล้วหาไม่เจอ'},
  {c:"  var sort = document.querySelector('#sort').value;",
   d:'อ่านค่าที่เลือกในช่องเรียงลำดับ'},
  {c:'  var list = dishes.filter(function(d){',
   d:'<code>filter</code> = <b>คัดเฉพาะชิ้นที่เงื่อนไขเป็นจริง แล้วได้รายการใหม่</b><br>สำคัญ: <b>ข้อมูลต้นฉบับ <code>dishes</code> ไม่ถูกแตะเลย</b> เราทำงานกับสำเนาเสมอ'},
  {c:'    var matchWord = (d.name + d.desc).toLowerCase().indexOf(q) !== -1;',
   d:'ต่อชื่อกับคำอธิบายเข้าด้วยกันแล้วค้นทีเดียว <b>ทำให้ค้นเจอแม้พิมพ์คำที่อยู่ในคำบรรยาย</b><br>เขียนสั้นกว่าได้ว่า <code>.includes(q)</code>'},
  {c:"    var matchCat  = (activeCat === 'ทั้งหมด') || (d.cat === activeCat);",
   d:'<code>||</code> = <b>จริงอย่างใดอย่างหนึ่งก็พอ</b><br>แปลว่า "ถ้าเลือกทั้งหมดก็ผ่านหมด หรือถ้าหมวดตรงกันก็ผ่าน"'},
  {c:'    return matchWord && matchCat;',
   d:'<code>&&</code> = <b>ต้องจริงทั้งสองอย่าง</b><br>นี่คือจุดที่ทำให้ค้นหาและกรองหมวดทำงานพร้อมกันได้ — <b>เพิ่มเงื่อนไขที่สามก็แค่ต่อ <code>&& matchXxx</code></b>'},
  {c:'  });', d:''},
  {c:"  if(sort === 'low')  list.sort(function(a,b){ return a.price - b.price; });",
   d:'<code>sort</code> ต้องการฟังก์ชันที่บอกว่า "สองตัวนี้ใครมาก่อน"<br><b>ผลลบ = a มาก่อน · ผลบวก = b มาก่อน</b><br>เอาน้อยไปมากใช้ <code>a - b</code> · มากไปน้อยใช้ <code>b - a</code>'},

  {c:'    grid.innerHTML = \'<div class="empty"><b>ไม่พบเมนูที่ค้นหา<\\/b>\' +\n                     \'ลองใช้คำที่สั้นลง หรือกดหมวด "ทั้งหมด"<\\/div>\';',
   d:'ข้อความสถานะว่างที่ดี<b>ต้องบอกว่าทำอะไรต่อได้</b> ไม่ใช่แค่ "ไม่พบข้อมูล"'},

  {c:'}', d:''},
  {c:"document.querySelector('#search').addEventListener('input', apply);",

/* ============ 7 ============ */
{
 t:'ปุ่มเลือกเมนู กับตัวนับที่ไม่หายเมื่อรีเฟรช',
 why:'ฟีเจอร์เล็กๆ ที่<b>ทำให้เว็บดูเป็นระบบจริง</b> และใช้เวลาแค่สิบนาที. เก็บลง <code>localStorage</code> แล้วกรรมการรีเฟรชหน้าเว็บ ข้อมูลยังอยู่ — เป็นจุดที่ได้คะแนนง่ายที่สุดจุดหนึ่ง.',
 rule:{t:'localStorage เก็บได้แค่ข้อความ', d:'ต้องแปลงก่อนเสมอ:<br><code>JSON.stringify(ของ)</code> ตอน<b>เซฟ</b> (ของ ➝ ข้อความ)<br><code>JSON.parse(ข้อความ)</code> ตอน<b>โหลด</b> (ข้อความ ➝ ของ)<br><br>ตอนโหลดต้องมี <code>|| []</code> ต่อท้ายเสมอ กันกรณีที่ยังไม่เคยเซฟ ไม่งั้นจะได้ null แล้วพัง'},
 css:`/* ===== 7. แถบสรุปรายการที่เลือก ===== */
.picked{
  position:sticky; bottom:0; z-index:40;

}
.picked.show{ display:block; }
.picked .wrap{ display:flex; align-items:center; gap:14px; flex-wrap:wrap; }
.picked .sum{ font-size:14.5px; }
.picked .sum b{ font-variant-numeric:tabular-nums; }
.picked .right{ margin-left:auto; display:flex; gap:8px; }

.dish .pick.added{ background:var(--accent); color:#fff; border-color:var(--accent); }`,
 partsLang:'html',
 partsWhere:'พิมพ์ก่อนปิด &lt;/body&gt;',
 parts:[
  {c:'<div class="picked" id="pickedBar">\n  <div class="wrap">\n    <span class="sum">เลือกไว้ <b id="pickCount">0</b> รายการ ·\n      รวม <b id="pickTotal">0</b> บาท</span>\n    <span class="right">\n      <button class="btn quiet" id="clearPick">ล้างทั้งหมด</button>\n      <a class="btn" href="#book">จองโต๊ะพร้อมสั่งล่วงหน้า</a>\n    </span>\n  </div>\n</div>',
   d:'แถบสรุปที่ติดขอบล่างจอ. <b>ตัวเลขทั้งสองอยู่ใน <code>&lt;b&gt;</code> ที่มี id</b> เพราะเดี๋ยว JavaScript จะเปลี่ยนเฉพาะตัวเลข ไม่แตะข้อความรอบๆ'},

  {c:'<script>', d:''},
  {c:"var picked = JSON.parse(localStorage.getItem('picked')) || [];",
   d:'<b>โหลดของที่เคยเลือกไว้ตอนเปิดหน้า</b><br>• <code>localStorage.getItem</code> คืน<b>ข้อความ</b> เสมอ<br>• <code>JSON.parse</code> แปลงข้อความกลับเป็น array<br>• <code>|| []</code> คือ<b>ค่าสำรองเมื่อยังไม่เคยเซฟ</b> — ขาดตรงนี้จะได้ <code>null</code> แล้วพังทันทีที่เรียก <code>.length</code>'},
  {c:"function savePicked(){\n  localStorage.setItem('picked', JSON.stringify(picked));\n}",
   d:'<b>ทางกลับกัน</b> — <code>JSON.stringify</code> แปลง array เป็นข้อความก่อนเซฟ เพราะ localStorage เก็บได้แต่ข้อความ<br>แยกเป็นฟังก์ชันเพราะ<b>ต้องเรียกทุกครั้งที่ข้อมูลเปลี่ยน</b> ลืมเรียกที่ใดที่หนึ่งแล้วข้อมูลจะหาย'},
  {c:'function renderPicked(){',
   d:'ฟังก์ชันวาดสถานะ "ของที่เลือก" ทั้งหมด <b>เรียกทุกครั้งหลังข้อมูลเปลี่ยน</b> — รูปแบบเดียวกับ <code>renderMenu</code>'},
  {c:'  var total = picked.reduce(function(sum, id){',

  {c:'    var d = dishes.find(function(x){ return x.id === id; });',
   d:'<code>find</code> = <b>หาชิ้นแรกที่ตรงเงื่อนไข</b><br>เราเก็บแค่ <code>id</code> ไว้ใน <code>picked</code> จึงต้องแปลงกลับเป็นข้อมูลเต็มเพื่อเอาราคา<br><b>ทำไมไม่เก็บทั้ง object:</b> เพราะถ้าราคาเปลี่ยน ข้อมูลที่เก็บไว้จะเก่าค้าง'},
  {c:'    return sum + (d ? d.price : 0);',

  {c:'  }, 0);',
   d:'เลข <code>0</code> ท้ายสุดคือ<b>ค่าเริ่มต้นของ sum</b> — ลืมใส่แล้ว reduce จะเอาชิ้นแรกมาเป็นค่าเริ่มต้น ซึ่งเป็น id ไม่ใช่ราคา'},
  {c:"  document.querySelector('#pickCount').textContent = picked.length;",

  {c:"  document.querySelector('#pickTotal').textContent = total.toLocaleString('th-TH');",
   d:'<b>ใส่ลูกน้ำคั่นหลักพันอัตโนมัติ</b> — 1234 กลายเป็น 1,234<br>รายละเอียดเล็กที่ทำให้ตัวเลขดูเป็นมืออาชีพทันที'},
  {c:"  document.querySelector('#pickedBar').classList.toggle('show', picked.length > 0);",
   d:'<b><code>toggle</code> แบบสองพารามิเตอร์</b> = ใส่ class เมื่อเงื่อนไขจริง เอาออกเมื่อเท็จ<br>เขียนบรรทัดเดียวแทน if-else — แถบจะโผล่เฉพาะตอนมีของเลือกไว้'},
  {c:"  document.querySelectorAll('.pick').forEach(function(b){\n    var on = picked.indexOf(Number(b.dataset.id)) !== -1;\n    b.classList.toggle('added', on);\n    b.textContent = on ? 'เลือกแล้ว' : 'เลือก';\n  });",
   d:'ไล่ปุ่มทุกอันแล้วอัปเดตหน้าตาให้ตรงกับข้อมูล<br><b><code>Number()</code> สำคัญมาก</b> — <code>dataset.id</code> คืน<b>ข้อความ</b> เสมอ ถ้าไม่แปลงเป็นตัวเลข <code>indexOf</code> จะหาไม่เจอตลอดกาล และไม่มี error แจ้ง'},
  {c:'}', d:''},
  {c:"grid.addEventListener('click', function(e){",
   d:'ผูกที่กล่องพ่ออีกครั้ง <b>เพราะปุ่ม "เลือก" ถูกสร้างใหม่ทุกครั้งที่กรอง</b> — ผูกทีละปุ่มจะหลุดทันทีที่วาดใหม่'},
  {c:"  if(!e.target.classList.contains('pick')) return;",
   d:'คลิกโดนรูปหรือชื่ออาหารก็ไม่ต้องทำอะไร <b>ทำงานเฉพาะเมื่อโดนปุ่มจริง</b>'},
  {c:'  var id = Number(e.target.dataset.id);\n  var at = picked.indexOf(id);',
   d:'อ่าน id ของปุ่มที่ถูกกด แล้วเช็คว่ามีอยู่ในรายการที่เลือกไว้แล้วหรือยัง'},
  {c:'  if(at === -1) picked.push(id);\n  else picked.splice(at, 1);',
   d:'<b>กดแล้วสลับ</b> — ยังไม่มีก็เพิ่ม (<code>push</code>) มีอยู่แล้วก็ลบออก (<code>splice(ตำแหน่ง, จำนวน)</code>)<br>ทำให้ปุ่มเดียวใช้ได้ทั้งเลือกและยกเลิก'},
  {c:'  savePicked();\n  renderPicked();',
   d:'<b>คู่นี้ต้องเรียกติดกันเสมอหลังข้อมูลเปลี่ยน</b> — เซฟก่อน แล้วค่อยวาดใหม่'},
  {c:'});', d:''},
  {c:"document.querySelector('#clearPick').addEventListener('click', function(){\n  picked = [];\n  savePicked();\n  renderPicked();\n});",

  {c:'var _render = renderMenu;\nrenderMenu = function(list){ _render(list); renderPicked(); };',
   d:'<b>ห่อฟังก์ชันเดิมไว้</b> — เก็บตัวจริงไว้ในชื่อใหม่ แล้วสร้างตัวใหม่ที่เรียกตัวจริงก่อนแล้วค่อยวาดสถานะปุ่มตาม<br><b>ถ้าไม่ทำ:</b> กรองหมวดแล้วปุ่ม "เลือกแล้ว" จะกลับเป็น "เลือก" หมด เพราะปุ่มถูกสร้างใหม่แต่ไม่มีใครไปอัปเดตสถานะ'},

/* ============ 8 ============ */
{
 t:'ฟอร์มจอง — ส่วนที่รับข้อมูลจากผู้ใช้',
 why:'ทุกโจทย์ที่มีคำว่า "ลงทะเบียน จอง สมัคร สั่งซื้อ" ต้องการส่วนนี้. หลักคือ<b>ถามให้น้อยที่สุดเท่าที่จำเป็น</b> และทุกช่องต้องมีป้ายกำกับที่ผูกกับช่องจริง.',
 rule:{t:'อย่าลืม novalidate', d:'ถ้าช่องมี <code>required</code> แต่แท็ก <code>&lt;form&gt;</code> ไม่มี <code>novalidate</code> เบราว์เซอร์จะบล็อกการส่งไว้เอง แล้ว<b>โค้ดตรวจสอบของเราจะไม่ทำงานเลย โดยไม่มี error แจ้ง</b>. เป็นกับดักที่กินเวลาเป็นชั่วโมง.'},
 css:`/* ===== 8. ฟอร์มจอง ===== */
#book{ background:var(--accent-soft); }

.booking{
  width:min(520px, 100%);
  background:var(--panel);
  border:1px solid var(--line); border-radius:16px;
  padding:28px;
}
.field{ display:flex; flex-direction:column; gap:6px; margin-bottom:16px; }
.field label{ font-size:13.5px; font-weight:600; }
.field label .opt{ font-weight:400; color:var(--ink-2); }
.field input, .field select{
  height:46px; padding:0 13px;
  border:1px solid var(--line); border-radius:9px; background:var(--panel);
}
.field input:focus, .field select:focus{
  outline:none; border-color:var(--accent);
  box-shadow:0 0 0 3px color-mix(in srgb, var(--accent) 16%, transparent);
}
.field .err{ display:none; font-size:12.5px; color:var(--bad); font-weight:500; }
.field .err::before{ content:"! "; font-weight:800; }
.field.bad input, .field.bad select{ border-color:var(--bad); background:#fff9f8; }
.field.bad .err{ display:block; }
.two{ display:grid; grid-template-columns:1fr 1fr; gap:14px; }

.done{
  display:none; margin-top:18px; padding:16px;
  border:1px solid var(--accent); background:var(--accent-soft);
  border-radius:10px; font-size:14.5px;
}
.done.show{ display:block; }
.done b{ display:block; margin-bottom:3px; }
@media(max-width:520px){ .two{ grid-template-columns:1fr; } }`,
 html:`<section id="book">
  <div class="wrap">
    <div class="head">
      <h2>จองโต๊ะล่วงหน้า</h2>
      <p>กรอกสี่ช่อง ใช้เวลาไม่ถึงหนึ่งนาที ทางร้านจะส่ง SMS ยืนยันภายใน 10 นาที</p>
    </div>

    <form class="booking" id="bookForm" novalidate>
      <div class="field" id="f-bname">
        <label for="bname">ชื่อผู้จอง</label>
        <input id="bname" name="bname" required>
        <span class="err">กรอกชื่อผู้จอง</span>
      </div>

      <div class="field" id="f-bphone">
        <label for="bphone">เบอร์โทร</label>
        <input id="bphone" name="bphone" type="tel" inputmode="numeric"
               maxlength="10" placeholder="0812345678" required>
        <span class="err">ต้องเป็นตัวเลข 10 หลัก ขึ้นต้นด้วย 0</span>
      </div>

      <div class="two">
        <div class="field" id="f-bdate">
          <label for="bdate">วันที่</label>
          <input id="bdate" name="bdate" type="date" required>
          <span class="err">เลือกวันที่</span>
        </div>
        <div class="field" id="f-bseat">
          <label for="bseat">จำนวนคน</label>
          <select id="bseat" name="bseat" required>
            <option value="">เลือก</option>
            <option>1-2 คน</option>
            <option>3-4 คน</option>
            <option>5-8 คน</option>

{

 html:`<script>
/* ---------- กฎการตรวจ: เพิ่มช่องใหม่ก็เพิ่มบรรทัดเดียว ---------- */
var bookRules = {
  bname : function(v){ return v.trim().length > 1; },
  bphone: function(v){ return /^0\\d{9}$/.test(v); },
  bdate : function(v){ return v !== ''; },
  bseat : function(v){ return v !== ''; }
};

var bookForm = document.querySelector('#bookForm');

/* ---------- ตรวจตอนออกจากช่อง / ลบคำเตือนเมื่อแก้ถูก ---------- */
Object.keys(bookRules).forEach(function(id){
  var el  = document.querySelector('#' + id);
  var box = document.querySelector('#f-' + id);

  el.addEventListener('blur', function(){
    box.classList.toggle('bad', !bookRules[id](el.value));
  });
  el.addEventListener('input', function(){
    if(bookRules[id](el.value)) box.classList.remove('bad');
  });
  el.addEventListener('change', function(){
    if(bookRules[id](el.value)) box.classList.remove('bad');
  });
});

/* ---------- ตอนกดส่ง ---------- */
bookForm.addEventListener('submit', function(e){
  e.preventDefault();

  var firstBad = null;
  Object.keys(bookRules).forEach(function(id){
    var el  = document.querySelector('#' + id);
    var bad = !bookRules[id](el.value);
    document.querySelector('#f-' + id).classList.toggle('bad', bad);
    if(bad && !firstBad) firstBad = el;
  });

  if(firstBad){ firstBad.focus(); return; }

  /* สรุปรายการอาหารที่เลือกไว้ให้ด้วย */
  var names = picked.map(function(id){
    var d = dishes.find(function(x){ return x.id === id; });
    return d ? d.name : '';
  }).filter(Boolean);

  var code = 'RC-' + String(Date.now()).slice(-4);

  document.querySelector('#bookDone').innerHTML =
    '<b>จองเรียบร้อย รหัสการจอง ' + code + '</b>' +
    'คุณ' + document.querySelector('#bname').value + ' · ' +
    document.querySelector('#bseat').value + ' · ' +
    document.querySelector('#bdate').value +
    (names.length ? '<br>สั่งล่วงหน้า: ' + names.join(', ') : '');

  document.querySelector('#bookDone').classList.add('show');
  bookForm.querySelector('button[type="submit"]').textContent = 'จองอีกครั้ง';
});
<\/script>`,

<script>
var burger = document.querySelector('#burger');
var siteNav = document.querySelector('#siteNav');

burger.addEventListener('click', function(){
  var open = siteNav.classList.toggle('open');
  burger.setAttribute('aria-expanded', open ? 'true' : 'false');
  burger.textContent = open ? '✕' : '☰';
});

  if(e.target.tagName !== 'A') return;
  siteNav.classList.remove('open');
  burger.setAttribute('aria-expanded', 'false');
  burger.textContent = '☰';
});
<\/script>`,

 html:`<script>
/* ---------- ไฮไลต์ลิงก์เมนูตามส่วนที่กำลังดู ---------- */
var spy = new IntersectionObserver(function(entries){
  entries.forEach(function(en){
    if(!en.isIntersecting) return;
    document.querySelectorAll('.site-nav a').forEach(function(a){
      a.classList.toggle('on', a.getAttribute('href') === '#' + en.target.id);
    });
  });
}, { rootMargin: '-45% 0px -50% 0px' });

document.querySelectorAll('section[id], footer[id]').forEach(function(s){
  spy.observe(s);
});

/* ---------- เอฟเฟกต์ค่อยๆ ปรากฏ ---------- */
document.querySelectorAll('.head, .booking, .faq').forEach(function(el){
  el.classList.add('reveal');
});

var revealer = new IntersectionObserver(function(entries){
  entries.forEach(function(en){
    if(en.isIntersecting){
      en.target.classList.add('in');
      revealer.unobserve(en.target);
    }
  });
}, { threshold: 0.12 });

document.querySelectorAll('.reveal').forEach(function(el){ revealer.observe(el); });
<\/script>`,

 css:`/* ===== 13. ขัดเงาสุดท้าย ===== */

/* ให้ทุกอย่างที่กดได้มีสถานะโฟกัสที่มองเห็น */
a:focus-visible, button:focus-visible, summary:focus-visible{

}

/* กันข้อความยาวผิดปกติทำให้หน้าเว็บล้นออกด้านข้าง */
body{ overflow-x:hidden; }
h1,h2,h3,p{ overflow-wrap:break-word; }
