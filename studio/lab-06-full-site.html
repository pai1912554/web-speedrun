 html:`<script>
/* ---------- สร้างปุ่มหมวดจากข้อมูล ไม่พิมพ์เอง ---------- */
var cats = ['ทั้งหมด'];
dishes.forEach(function(d){
  if(cats.indexOf(d.cat) === -1) cats.push(d.cat);
});

var activeCat = 'ทั้งหมด';

document.querySelector('#cats').innerHTML = cats.map(function(c){
  return '<button class="cat' + (c === activeCat ? ' on' : '') + '" data-cat="' + c + '">' + c + '</button>';
}).join('');

/* ---------- ฟังก์ชันกลาง: อ่านทุกเงื่อนไขแล้ววาดใหม่ ---------- */
function apply(){
  var q = document.querySelector('#search').value.toLowerCase().trim();
  var sort = document.querySelector('#sort').value;

  var list = dishes.filter(function(d){
    var matchWord = (d.name + d.desc).toLowerCase().indexOf(q) !== -1;
    var matchCat  = (activeCat === 'ทั้งหมด') || (d.cat === activeCat);
    return matchWord && matchCat;
  });

  if(sort === 'low')  list.sort(function(a,b){ return a.price - b.price; });
  if(sort === 'high') list.sort(function(a,b){ return b.price - a.price; });

  document.querySelector('#count').textContent = 'พบ ' + list.length + ' เมนู';

  if(list.length === 0){
    grid.innerHTML = '<div class="empty"><b>ไม่พบเมนูที่ค้นหา</b>' +
                     'ลองใช้คำที่สั้นลง หรือกดหมวด "ทั้งหมด"</div>';
    return;
  }
  renderMenu(list);
}

/* ---------- ต่อสายเหตุการณ์ ---------- */
document.querySelector('#search').addEventListener('input', apply);
document.querySelector('#sort').addEventListener('change', apply);

document.querySelector('#cats').addEventListener('click', function(e){
  if(!e.target.dataset.cat) return;
  activeCat = e.target.dataset.cat;
  document.querySelectorAll('.cat').forEach(function(b){
    b.classList.toggle('on', b === e.target);
  });
  apply();
});

apply();
<\/script>`,

{

 css:`/* ===== 7. แถบสรุปรายการที่เลือก ===== */
.picked{
  position:sticky; bottom:0; z-index:40;
  background:var(--panel); border-top:1px solid var(--line);
  padding:12px 0; display:none;
}
.picked.show{ display:block; }
.picked .wrap{ display:flex; align-items:center; gap:14px; flex-wrap:wrap; }
.picked .sum{ font-size:14.5px; }
.picked .sum b{ font-variant-numeric:tabular-nums; }

.dish .pick.added{ background:var(--accent); color:#fff; border-color:var(--accent); }`,
 html:`<div class="picked" id="pickedBar">
  <div class="wrap">
    <span class="sum">เลือกไว้ <b id="pickCount">0</b> รายการ ·
      รวม <b id="pickTotal">0</b> บาท</span>
    <span class="right">
      <button class="btn quiet" id="clearPick">ล้างทั้งหมด</button>
      <a class="btn" href="#book">จองโต๊ะพร้อมสั่งล่วงหน้า</a>
    </span>
  </div>
</div>

<script>
/* ---------- โหลดของที่เคยเลือกไว้ ---------- */
var picked = JSON.parse(localStorage.getItem('picked')) || [];

function savePicked(){
  localStorage.setItem('picked', JSON.stringify(picked));
}

function renderPicked(){
  var total = picked.reduce(function(sum, id){
    var d = dishes.find(function(x){ return x.id === id; });
    return sum + (d ? d.price : 0);
  }, 0);

  document.querySelector('#pickCount').textContent = picked.length;
  document.querySelector('#pickTotal').textContent = total.toLocaleString('th-TH');
  document.querySelector('#pickedBar').classList.toggle('show', picked.length > 0);

  document.querySelectorAll('.pick').forEach(function(b){
    var on = picked.indexOf(Number(b.dataset.id)) !== -1;
    b.classList.toggle('added', on);
    b.textContent = on ? 'เลือกแล้ว' : 'เลือก';
  });
}

/* ---------- กดเลือก / ยกเลิก ---------- */
grid.addEventListener('click', function(e){
  if(!e.target.classList.contains('pick')) return;
  var id = Number(e.target.dataset.id);
  var at = picked.indexOf(id);
  if(at === -1) picked.push(id);
  else picked.splice(at, 1);
  savePicked();
  renderPicked();
});

document.querySelector('#clearPick').addEventListener('click', function(){
  picked = [];
  savePicked();
  renderPicked();
});

/* ---------- วาดสถานะปุ่มใหม่ทุกครั้งที่รายการถูกวาดใหม่ ---------- */
var _render = renderMenu;
renderMenu = function(list){ _render(list); renderPicked(); };
renderPicked();

 css:`/* ===== 8. ฟอร์มจอง ===== */
#book{ background:var(--accent-soft); }

.booking{
  width:min(520px, 100%);
  background:var(--panel);
  border:1px solid var(--line); border-radius:16px;
  padding:28px;
}
.field{ display:flex; flex-direction:column; gap:6px; margin-bottom:16px; }
.field label{ font-size:13.5px; font-weight:600; }
.field label .opt{ font-weight:400; color:var(--ink-2); }
.field input, .field select{
  height:46px; padding:0 13px;
  border:1px solid var(--line); border-radius:9px; background:var(--panel);
}
.field input:focus, .field select:focus{
  outline:none; border-color:var(--accent);
  box-shadow:0 0 0 3px color-mix(in srgb, var(--accent) 16%, transparent);
}
.field .err{ display:none; font-size:12.5px; color:var(--bad); font-weight:500; }
.field .err::before{ content:"! "; font-weight:800; }
.field.bad input, .field.bad select{ border-color:var(--bad); background:#fff9f8; }
.field.bad .err{ display:block; }
.two{ display:grid; grid-template-columns:1fr 1fr; gap:14px; }

.done{
  display:none; margin-top:18px; padding:16px;
  border:1px solid var(--accent); background:var(--accent-soft);
  border-radius:10px; font-size:14.5px;
}
.done.show{ display:block; }
.done b{ display:block; margin-bottom:3px; }
@media(max-width:520px){ .two{ grid-template-columns:1fr; } }`,
 html:`<section id="book">

{
 t:'ตรวจข้อมูลฟอร์ม และแสดงผลการจอง',
 why:'โค้ดตรวจฟอร์มมีรูปแบบตายตัว จำได้อันเดียวใช้ได้ทุกงาน: <b>เก็บกฎไว้ในที่เดียว ➝ ตรวจตอนออกจากช่อง ➝ ลบคำเตือนเมื่อแก้ถูก ➝ ตอนกดส่งตรวจทั้งหมดแล้วพาไปช่องแรกที่ผิด</b>.',
 rule:{t:'ข้อความผิดพลาดต้องบอกวิธีแก้', d:'"ข้อมูลไม่ถูกต้อง" ไม่ช่วยอะไรเลย. เขียนว่า <b>"ต้องเป็นตัวเลข 10 หลัก ขึ้นต้นด้วย 0"</b> แทน — ผู้ใช้รู้ทันทีว่าต้องทำอะไรต่อ. และต้องมีสัญลักษณ์ประกอบ ไม่ใช่ใช้สีแดงอย่างเดียว เพราะคนตาบอดสีมองไม่เห็น.'},
 html:`<script>
/* ---------- กฎการตรวจ: เพิ่มช่องใหม่ก็เพิ่มบรรทัดเดียว ---------- */
var bookRules = {
  bname : function(v){ return v.trim().length > 1; },
  bphone: function(v){ return /^0\\d{9}$/.test(v); },
  bdate : function(v){ return v !== ''; },
  bseat : function(v){ return v !== ''; }
};

var bookForm = document.querySelector('#bookForm');

/* ---------- ตรวจตอนออกจากช่อง / ลบคำเตือนเมื่อแก้ถูก ---------- */
Object.keys(bookRules).forEach(function(id){
  var el  = document.querySelector('#' + id);
  var box = document.querySelector('#f-' + id);

  el.addEventListener('blur', function(){
    box.classList.toggle('bad', !bookRules[id](el.value));
  });
  el.addEventListener('input', function(){
    if(bookRules[id](el.value)) box.classList.remove('bad');
  });
  el.addEventListener('change', function(){
    if(bookRules[id](el.value)) box.classList.remove('bad');
  });
});

/* ---------- ตอนกดส่ง ---------- */
bookForm.addEventListener('submit', function(e){
  e.preventDefault();

  var firstBad = null;
  Object.keys(bookRules).forEach(function(id){
    var el  = document.querySelector('#' + id);
    var bad = !bookRules[id](el.value);
    document.querySelector('#f-' + id).classList.toggle('bad', bad);
    if(bad && !firstBad) firstBad = el;
  });

  if(firstBad){ firstBad.focus(); return; }

  /* สรุปรายการอาหารที่เลือกไว้ให้ด้วย */
  var names = picked.map(function(id){
    var d = dishes.find(function(x){ return x.id === id; });
    return d ? d.name : '';
  }).filter(Boolean);

  var code = 'RC-' + String(Date.now()).slice(-4);

  document.querySelector('#bookDone').innerHTML =
    '<b>จองเรียบร้อย รหัสการจอง ' + code + '</b>' +
    'คุณ' + document.querySelector('#bname').value + ' · ' +
    document.querySelector('#bseat').value + ' · ' +
    document.querySelector('#bdate').value +
    (names.length ? '<br>สั่งล่วงหน้า: ' + names.join(', ') : '');

  document.querySelector('#bookDone').classList.add('show');
  bookForm.querySelector('button[type="submit"]').textContent = 'จองอีกครั้ง';
});
<\/script>`,

  burger.setAttribute('aria-expanded', open ? 'true' : 'false');
  burger.textContent = open ? '✕' : '☰';
});

/* ปิดเมนูอัตโนมัติเมื่อกดลิงก์ ไม่งั้นเมนูจะค้างบังเนื้อหา */
siteNav.addEventListener('click', function(e){
  if(e.target.tagName !== 'A') return;
  siteNav.classList.remove('open');
  burger.setAttribute('aria-expanded', 'false');
  burger.textContent = '☰';
});
<\/script>`,

{

 why:'รายละเอียดที่<b>ทำให้เว็บดูเป็นงานที่คิดมาครบ</b>. เมื่อเลื่อนถึงส่วนไหน ลิงก์บนแถบเมนูของส่วนนั้นจะเน้นขึ้นมาเอง. ใช้เวลา 5 นาที แต่กรรมการสังเกตเห็น.',
 rule:{t:'IntersectionObserver คืออะไร', d:'เครื่องมือที่คอย<b>ดูว่าของชิ้นไหนเข้ามาอยู่ในจอแล้ว</b> โดยไม่ต้องคำนวณตำแหน่งเอง. ใช้ได้ทั้งไฮไลต์เมนู เอฟเฟกต์ค่อยๆ ปรากฏ และโหลดข้อมูลเพิ่มเมื่อเลื่อนถึงท้ายหน้า.'},
 css:`/* ===== 12. เอฟเฟกต์ค่อยๆ ปรากฏ ===== */
.reveal{ opacity:0; transform:translateY(16px); transition:.55s ease; }
.reveal.in{ opacity:1; transform:none; }

/* เคารพผู้ใช้ที่ไม่ต้องการภาพเคลื่อนไหว */
@media (prefers-reduced-motion:reduce){
  *{ transition:none !important; animation:none !important; }
  .reveal{ opacity:1; transform:none; }
}`,
 html:`<script>
/* ---------- ไฮไลต์ลิงก์เมนูตามส่วนที่กำลังดู ---------- */
var spy = new IntersectionObserver(function(entries){
  entries.forEach(function(en){
    if(!en.isIntersecting) return;
    document.querySelectorAll('.site-nav a').forEach(function(a){
      a.classList.toggle('on', a.getAttribute('href') === '#' + en.target.id);
    });
  });
}, { rootMargin: '-45% 0px -50% 0px' });

document.querySelectorAll('section[id], footer[id]').forEach(function(s){
  spy.observe(s);
});

/* ---------- เอฟเฟกต์ค่อยๆ ปรากฏ ---------- */
document.querySelectorAll('.head, .booking, .faq').forEach(function(el){
  el.classList.add('reveal');
});

var revealer = new IntersectionObserver(function(entries){
  entries.forEach(function(en){
    if(en.isIntersecting){
      en.target.classList.add('in');
      revealer.unobserve(en.target);
    }
  });
}, { threshold: 0.12 });

document.querySelectorAll('.reveal').forEach(function(el){ revealer.observe(el); });
<\/script>`,

 rule:{t:'เช็กลิสต์ก่อนส่ง 10 ข้อ', d:'1) กด <kbd>F12</kbd> ดู Console ไม่มีตัวแดง<br>2) กดทุกปุ่มทุกลิงก์ ไม่มีอันไหนกดแล้วเงียบ<br>3) กด <kbd>Ctrl</kbd>+<kbd>Shift</kbd>+<kbd>M</kbd> ดูมือถือ ไม่มีของล้น<br>4) กด <kbd>Tab</kbd> รัวๆ เห็นกรอบโฟกัสครบทุกปุ่ม<br>5) ทุก <code>&lt;img&gt;</code> มี <code>alt</code><br>6) ทุก <code>&lt;input&gt;</code> มี <code>&lt;label for&gt;</code> ที่ตรงกับ id<br>7) <code>&lt;title&gt;</code> เป็นชื่องานจริง<br>8) ไม่มีคำว่า test, Lorem, ชื่อเว็บ หลงเหลือ<br>9) กด <kbd>Shift</kbd>+<kbd>Alt</kbd>+<kbd>F</kbd> จัดโค้ดให้สวย<br>10) รีเฟรชหน้าใหม่หมด แล้วลองใช้งานตั้งแต่ต้นอีกรอบ'},

/* ให้ทุกอย่างที่กดได้มีสถานะโฟกัสที่มองเห็น */

/* กันข้อความยาวผิดปกติทำให้หน้าเว็บล้นออกด้านข้าง */
