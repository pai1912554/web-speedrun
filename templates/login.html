<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>เข้าสู่ระบบ</title>
<style>
:root{
  --bg:#0b0e14;--surface:#151a24;--text:#e9edf3;--muted:#8e99ab;--line:#242b38;
  --brand:#4f8cff;--ok:#3ddc97;--bad:#ff5c5c;--r:14px;
}
*,*::before,*::after{box-sizing:border-box}*{margin:0}
input,button{font:inherit;color:inherit}
body{background:var(--bg);color:var(--text);line-height:1.6;
  font-family:system-ui,"Segoe UI","Noto Sans Thai",sans-serif;
  /* ===== สูตรจัดกลางกลางจอ ===== */
  display:flex;align-items:center;justify-content:center;min-height:100vh;padding:20px;
  background-image:radial-gradient(700px 400px at 30% 0%,rgba(79,140,255,.16),transparent 70%)}

.box{width:min(420px,100%);background:var(--surface);border:1px solid var(--line);
  border-radius:20px;padding:34px;box-shadow:0 20px 60px rgba(0,0,0,.45)}
.logo{text-align:center;font-size:22px;font-weight:800;letter-spacing:-.5px;margin-bottom:6px}
.logo i{color:var(--brand);font-style:normal}
.tagline{text-align:center;color:var(--muted);font-size:14px;margin-bottom:24px}

/* ===== แท็บสลับ เข้าสู่ระบบ / สมัคร ===== */
.tabs{display:flex;background:var(--bg);border:1px solid var(--line);border-radius:11px;
  padding:4px;margin-bottom:22px}
.tabs button{flex:1;background:transparent;border:0;padding:9px;border-radius:8px;
  color:var(--muted);cursor:pointer;font-size:14.5px;transition:.18s}
.tabs button.active{background:var(--brand);color:#fff;font-weight:600}

.field{margin-bottom:15px}
.field label{display:block;font-size:13px;color:var(--muted);margin-bottom:6px}
.field input{width:100%;background:var(--bg);border:1px solid var(--line);
  padding:12px 13px;border-radius:10px;transition:.15s}
.field input:focus{outline:0;border-color:var(--brand);box-shadow:0 0 0 3px rgba(79,140,255,.18)}
.pw{position:relative}
.pw button{position:absolute;right:8px;top:50%;transform:translateY(-50%);
  background:transparent;border:0;color:var(--muted);cursor:pointer;font-size:12.5px;padding:6px}

.row{display:flex;align-items:center;justify-content:space-between;font-size:13.5px;margin:16px 0}
.row label{display:flex;align-items:center;gap:7px;color:var(--muted);cursor:pointer}
.row a{color:var(--brand);text-decoration:none}

.btn{width:100%;background:var(--brand);color:#fff;border:0;padding:13px;border-radius:10px;
  font-weight:700;cursor:pointer;transition:.18s}
.btn:hover{filter:brightness(1.12)}
.btn.ghost{background:transparent;border:1px solid var(--line);color:var(--text);margin-top:10px}

.msg{font-size:13.5px;margin-top:14px;text-align:center;min-height:20px}
.msg.bad{color:var(--bad)} .msg.ok{color:var(--ok)}

.divider{display:flex;align-items:center;gap:12px;color:var(--muted);font-size:12.5px;margin:20px 0}
.divider::before,.divider::after{content:"";flex:1;height:1px;background:var(--line)}

.meter{height:4px;background:var(--line);border-radius:99px;margin-top:8px;overflow:hidden}
.meter i{display:block;height:100%;width:0;transition:.3s}
.hidden{display:none}
</style>
</head>
<body>

<div class="box">
  <div class="logo">Nimbus<i>ID</i></div>
  <p class="tagline">บัญชีเดียว ใช้ได้ทุกบริการ</p>

  <div class="tabs">
    <button id="tabLogin" class="active">เข้าสู่ระบบ</button>
    <button id="tabReg">สมัครสมาชิก</button>
  </div>

  <!-- ============ ฟอร์มเข้าสู่ระบบ ============ -->
  <form id="loginForm">
    <div class="field">
      <label for="lu">อีเมลหรือชื่อผู้ใช้</label>
      <input id="lu" required placeholder="you@email.com">
    </div>
    <div class="field">
      <label for="lp">รหัสผ่าน</label>
      <div class="pw">
        <input id="lp" type="password" required placeholder="••••••••">
        <button type="button" data-toggle="lp">แสดง</button>
      </div>
    </div>
    <div class="row">
      <label><input type="checkbox" id="remember"> จำฉันไว้</label>
      <a href="#">ลืมรหัสผ่าน?</a>
    </div>
    <button class="btn" type="submit">เข้าสู่ระบบ</button>
    <div class="divider">หรือ</div>
    <button class="btn ghost" type="button">เข้าสู่ระบบด้วย Google</button>
    <p class="msg" id="loginMsg"></p>
  </form>

  <!-- ============ ฟอร์มสมัคร ============ -->
  <form id="regForm" class="hidden">
    <div class="field">
      <label for="rn">ชื่อที่ใช้แสดง</label>
      <input id="rn" required placeholder="สมชาย">
    </div>
    <div class="field">
      <label for="re">อีเมล</label>
      <input id="re" type="email" required placeholder="you@email.com">
    </div>
    <div class="field">
      <label for="rp">รหัสผ่าน</label>
      <div class="pw">
        <input id="rp" type="password" required placeholder="อย่างน้อย 8 ตัวอักษร">
        <button type="button" data-toggle="rp">แสดง</button>
      </div>
      <div class="meter"><i id="meter"></i></div>
      <p class="msg" id="strength" style="text-align:left;margin-top:6px"></p>
    </div>
    <div class="field">
      <label for="rp2">ยืนยันรหัสผ่าน</label>
      <input id="rp2" type="password" required>
    </div>
    <button class="btn" type="submit">สร้างบัญชี</button>
    <p class="msg" id="regMsg"></p>
  </form>
</div>

<script>
/* ============ สลับแท็บ ============ */
const tabLogin = document.querySelector('#tabLogin');
const tabReg   = document.querySelector('#tabReg');
const loginForm= document.querySelector('#loginForm');
const regForm  = document.querySelector('#regForm');

tabLogin.addEventListener('click', () => switchTab(true));
tabReg  .addEventListener('click', () => switchTab(false));

function switchTab(isLogin){
  tabLogin.classList.toggle('active', isLogin);
  tabReg  .classList.toggle('active', !isLogin);
  loginForm.classList.toggle('hidden', !isLogin);
  regForm  .classList.toggle('hidden', isLogin);
}

/* ============ ปุ่มแสดง/ซ่อนรหัสผ่าน ============ */
document.querySelectorAll('[data-toggle]').forEach(btn => {
  btn.addEventListener('click', () => {
    const inp = document.querySelector('#' + btn.dataset.toggle);
    const show = inp.type === 'password';
    inp.type = show ? 'text' : 'password';
    btn.textContent = show ? 'ซ่อน' : 'แสดง';
  });
});

/* ============ วัดความแข็งแรงรหัสผ่าน ============ */
document.querySelector('#rp').addEventListener('input', e => {
  const v = e.target.value;
  let score = 0;
  if(v.length >= 8) score++;
  if(/[A-Z]/.test(v)) score++;
  if(/[0-9]/.test(v)) score++;
  if(/[^A-Za-z0-9]/.test(v)) score++;

  const levels = [
    {w:'0%',   c:'',            t:''},
    {w:'25%',  c:'#ff5c5c',     t:'อ่อนมาก'},
    {w:'50%',  c:'#ffb020',     t:'พอใช้'},
    {w:'75%',  c:'#4f8cff',     t:'ดี'},
    {w:'100%', c:'#3ddc97',     t:'แข็งแรงมาก'},
  ];
  const lv = levels[v ? score : 0];
  const meter = document.querySelector('#meter');
  meter.style.width = lv.w;
  meter.style.background = lv.c;
  document.querySelector('#strength').textContent = lv.t;
});

/* ============ สมัครสมาชิก (เก็บใน localStorage) ============ */
regForm.addEventListener('submit', e => {
  e.preventDefault();
  const msg = document.querySelector('#regMsg');
  const p1 = document.querySelector('#rp').value;
  const p2 = document.querySelector('#rp2').value;

  if(p1.length < 8){ msg.className='msg bad'; msg.textContent='รหัสผ่านต้องยาวอย่างน้อย 8 ตัวอักษร'; return; }
  if(p1 !== p2)    { msg.className='msg bad'; msg.textContent='รหัสผ่านทั้งสองช่องไม่ตรงกัน'; return; }

  const users = JSON.parse(localStorage.getItem('users')) || [];
  const email = document.querySelector('#re').value.trim();
  if(users.some(u => u.email === email)){
    msg.className='msg bad'; msg.textContent='อีเมลนี้ถูกใช้สมัครแล้ว'; return;
  }
  users.push({ name: document.querySelector('#rn').value.trim(), email, pass: p1 });
  localStorage.setItem('users', JSON.stringify(users));

  msg.className='msg ok'; msg.textContent='สมัครสำเร็จ เข้าสู่ระบบได้เลย';
  regForm.reset();
  setTimeout(() => switchTab(true), 900);
});

/* ============ เข้าสู่ระบบ ============ */
loginForm.addEventListener('submit', e => {
  e.preventDefault();
  const msg = document.querySelector('#loginMsg');
  const id  = document.querySelector('#lu').value.trim();
  const pw  = document.querySelector('#lp').value;

  const users = JSON.parse(localStorage.getItem('users')) || [];
  const user  = users.find(u => u.email === id && u.pass === pw);

  if(!user){ msg.className='msg bad'; msg.textContent='อีเมลหรือรหัสผ่านไม่ถูกต้อง'; return; }

  msg.className='msg ok';
  msg.textContent = 'ยินดีต้อนรับ ' + user.name;
  if(document.querySelector('#remember').checked)
    localStorage.setItem('lastUser', id);
});

/* ============ เติมชื่อผู้ใช้ที่จำไว้ ============ */
const last = localStorage.getItem('lastUser');
if(last){
  document.querySelector('#lu').value = last;
  document.querySelector('#remember').checked = true;
}
</script>
</body>
</html>
